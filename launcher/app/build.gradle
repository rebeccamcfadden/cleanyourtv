plugins {
    id 'com.android.application'
}

// The TV's build settings (docs/rework.md): launcher/tv.properties, gitignored, or the committed example while it is
// missing. Checked here so a typo fails the build instead of giving the TV weather for nowhere.
def tvPropsFile = rootProject.file('tv.properties')
if (!tvPropsFile.exists()) tvPropsFile = rootProject.file('tv.properties.example')
def tvProps = new Properties()
// UTF-8, so a weather_city such as Malmö can be written as it is spelled.
tvPropsFile.withReader('UTF-8') { tvProps.load(it) }
def tvSetting = { String key ->
    def value = tvProps.getProperty(key)?.trim()
    if (!value) throw new GradleException("${tvPropsFile.name}: ${key} is missing")
    return value
}
def weatherLatitude = tvSetting('latitude')
def weatherLongitude = tvSetting('longitude')
// Optional: set, it is the TV default unit; left out, the TV's region decides (WeatherPrefs.defaultFahrenheit).
def temperatureUnit = tvProps.getProperty('temperature_unit', '').trim().toUpperCase(Locale.ROOT)
// Parsed to doubles and written back with Double.toString, never copied verbatim: Java would read "010" as octal.
def coordinate = { String key, String value, double limit ->
    def number = value.isDouble() ? value.toDouble() : Double.NaN
    if (number.isNaN() || number.isInfinite() || Math.abs(number) > limit) {
        throw new GradleException("${tvPropsFile.name}: ${key} must be a number from -${(int) limit} to ${(int) limit}")
    }
    return Double.toString(number)
}
weatherLatitude = coordinate('latitude', weatherLatitude, 90)
weatherLongitude = coordinate('longitude', weatherLongitude, 180)
if (!(temperatureUnit in ['', 'C', 'F'])) throw new GradleException("${tvPropsFile.name}: temperature_unit must be C or F")
// Optional: the city at latitude and longitude, named on the quick-settings Weather row ("Stockholm · °C") and in
// Launcher settings until a place is chosen on the TV; without it they say Default. No quote, backslash or control
// character, so it can't break the generated Java; letters beyond ASCII go in as Java's unicode escapes. The message
// never prints the value.
def weatherCity = tvProps.getProperty('weather_city', '').trim()
if (weatherCity.length() > 60 || weatherCity.any { Character.isISOControl(it as char) || it == '"' || it == '\\' }) {
    throw new GradleException("${tvPropsFile.name}: weather_city must be at most 60 characters, " +
            "without a quote, a backslash or a control character")
}
weatherCity = weatherCity.collect { String ch ->
    int c = (ch as char) as int
    c < 0x80 ? ch : String.format('\\u%04X', c)
}.join('')
// Optional: TMDB's v4 read access token. Without one the launcher shows the mock catalogue (docs/rework.md). Only
// the characters a token has, so it can't break the generated Java; the message never prints the value.
def tmdbToken = tvProps.getProperty('tmdb_api_key', '').trim()
if (tmdbToken && !(tmdbToken ==~ /[A-Za-z0-9._\-]+/)) {
    throw new GradleException("${tvPropsFile.name}: tmdb_api_key has characters a TMDB token never has")
}
// Optional price keys (BACKLOG.md, Streaming availability and prices): without them the source is skipped. Any
// printable ASCII but a space, a double quote or a backslash, so a key can't break the generated Java string; the
// message never prints the value.
def priceKey = { String key ->
    def value = tvProps.getProperty(key, '').trim()
    if (value && !(value ==~ /[!-~&&[^"\\]]+/)) throw new GradleException("${tvPropsFile.name}: ${key} has a space, a quote, a backslash or a character outside printable ASCII")
    return value
}
def watchmodeKey = priceKey('watchmode_api_key')
// Movie of the Night's key under the project lead's name, or under its API's other name; Java picks (PriceKeys).
def movieOfTheNightKey = priceKey('movie_of_the_night_api_key')
def streamingAvailabilityKey = priceKey('streaming_availability_api_key')
// Where the themes' photos and drawings are downloaded from (launcher/backdrops/README.md): https only, and only the
// characters a URL needs, so it can't break the generated Java.
def themeAssetsUrl = tvProps.getProperty('theme_assets_url', '').trim()
if (!themeAssetsUrl) themeAssetsUrl = 'https://cdn.jsdelivr.net/gh/rebeccamcfadden/cleanyourtv@main/launcher/backdrops/'
if (!(themeAssetsUrl ==~ /https:\/\/[A-Za-z0-9._~:\/@%+\-]+/)) {
    throw new GradleException("${tvPropsFile.name}: theme_assets_url must be an https:// address")
}
if (!themeAssetsUrl.endsWith('/')) themeAssetsUrl += '/'
// Optional: the household's shared "Send to TV" shortcut, an iCloud link (docs/phone-notes.md). It is per household,
// so it lives here rather than in config.xml; only https://www.icloud.com/shortcuts/ links with the characters such a
// link has, so it can't break the generated Java. The message never prints the value.
def noteShortcutUrl = tvProps.getProperty('note_shortcut_url', '').trim()
if (noteShortcutUrl && !(noteShortcutUrl ==~ /https:\/\/www\.icloud\.com\/shortcuts\/[A-Za-z0-9._:\/\-]{1,160}/)) {
    throw new GradleException("${tvPropsFile.name}: note_shortcut_url must be an https://www.icloud.com/shortcuts/ link")
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '2.7'

        buildConfigField 'double', 'WEATHER_LATITUDE', weatherLatitude
        buildConfigField 'double', 'WEATHER_LONGITUDE', weatherLongitude
        buildConfigField 'String', 'TEMPERATURE_UNIT', "\"${temperatureUnit}\""
        buildConfigField 'String', 'WEATHER_CITY', "\"${weatherCity}\""
        buildConfigField 'String', 'TMDB_TOKEN', "\"${tmdbToken}\""
        buildConfigField 'String', 'WATCHMODE_KEY', "\"${watchmodeKey}\""
        buildConfigField 'String', 'MOVIE_OF_THE_NIGHT_KEY', "\"${movieOfTheNightKey}\""
        buildConfigField 'String', 'STREAMING_AVAILABILITY_KEY', "\"${streamingAvailabilityKey}\""
        buildConfigField 'String', 'THEME_ASSETS_URL', "\"${themeAssetsUrl}\""
        buildConfigField 'String', 'NOTE_SHORTCUT_URL', "\"${noteShortcutUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // Android's own org.json is a stub on the JVM; the weather parser's tests need a real one.
    testImplementation 'org.json:json:20240303'
}

// Some unit tests read files under src/main/res straight from disk (NoteWordsTest, MockCatalogTest); declaring them as
// inputs keeps the build cache from reusing a passing result after only those files changed.
tasks.withType(Test).configureEach {
    inputs.dir('src/main/res').withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName('mainRes')
}
