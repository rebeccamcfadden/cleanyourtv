name: Design preview on Pages

# Builds design_preview/ (mock data only) and publishes it on GitHub Pages after every merge to main.
# Vite's base is './', so the site works under any sub-path: https://<owner>.github.io/<repo>/ keeps working
# after the repo is renamed. Pages must be enabled once with Settings › Pages › Source = GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "design_preview/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the design preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design_preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: design_preview/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: design_preview/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
