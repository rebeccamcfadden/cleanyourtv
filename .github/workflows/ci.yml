name: CI

# Runs after a merge to main only, to keep GitHub Actions usage low (the project lead, 2026-11-01: Actions was
# disabled once for usage). Pull requests are checked on a maintainer's machine by `tools/ci-local.ps1`, whose
# `local-ci/*` statuses the main ruleset requires. Docs-only merges skip it; run it by hand with workflow_dispatch.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "shots/**", "work/**", ".github/maintainer/**"]
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Example lists, README tables, shell helpers
        env:
          CLEANYOURTV_STRICT: "1"
        run: python3 -m unittest discover -s tests -v

  tables:
    # Main only: a list PR adds just its folder and tv.json, so on a pull request the tables lag on purpose.
    # A job of its own, so "the tables want regenerating" never reads as "the lists are broken": the merge
    # bot waits for main to be green between merges and regenerates the tables after the wave.
    name: README tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: README TV tables match examples/*/tv.json
        run: |
          python3 tools/gen_tables.py --check || {
            echo "::error::README.md and examples/README.md are generated from examples/*/tv.json. A maintainer runs python3 tools/gen_tables.py on main and commits the result; contributors never need to."
            exit 1
          }

  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: APK size (gate at 1 MB in this fork, see docs/rework.md)
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          limit=1048576
          echo "release APK: $size B ($((size / 1024)) KB), limit $limit B" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::release APK is $size B, over the $limit B gate"
            exit 1
          fi
